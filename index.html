<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Für meine Traumfrau ❤️</title>
    <style>
        /* Grundstyling & Romantischer Hintergrund */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffe5ec 0%, #ffb3c6 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            perspective: 1200px; /* Wichtig für den 3D-Effekt der Tür */
        }

        /* Container für das Liebesgeständnis (liegt HINTER der Tür) */
        .love-letter-container {
            position: absolute;
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: scale(0.8);
            transition: all 1.5s ease-in-out;
            transition-delay: 0.5s; /* Wartet, bis die Tür sich leicht geöffnet hat */
            z-index: 1;
        }

        .love-letter-container h1 {
            color: #ff477e;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .love-letter-container p {
            color: #4a4a4a;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .heart {
            color: #ff477e;
            font-size: 3rem;
            animation: pulse 1.5s infinite;
            margin-top: 20px;
        }

        /* 3D-Tür-Rahmen */
        .door-frame {
            position: relative;
            width: 220px;
            height: 380px;
            background: #6f4e37; /* Holzrahmen-Farbe */
            border: 8px solid #523a28;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transform-style: preserve-3d;
            z-index: 2;
            transition: all 1s ease;
        }

        /* Die eigentliche Tür */
        .door {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #b56576; /* Elegantes Altrosa/Rot für die Tür */
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            border-radius: 2px;
            transform-origin: left center; /* Tür öffnet sich von links */
            transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
            box-sizing: border-box;
        }

        /* Tür-Details (Kassetten-Optik für mehr Eleganz) */
        .door::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 10%;
            width: 80%;
            height: 35%;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        .door::after {
            content: '';
            position: absolute;
            bottom: 10%;
            left: 10%;
            width: 80%;
            height: 35%;
            border: 3px solid rgba(255,255,255,0.2);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }

        /* Der Türknauf */
        .doorknob {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%); /* Goldener Knauf */
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            z-index: 10;
            transition: transform 0.3s;
        }

        .door:hover .doorknob {
            transform: scale(1.1);
        }

        /* --- ANIMATIONS-ZUSTÄNDE (wenn geöffnet) --- */
        
        .door-frame.open {
            box-shadow: 0 10px 30px rgba(0,0,0,0.0);
            border-color: transparent;
            background: transparent;
            pointer-events: none; /* Verhindert, dass man die unsichtbare Tür nochmal klickt */
        }

        /* Tür schwingt im 3D-Raum auf */
        .door-frame.open .door {
            transform: rotateY(-130deg);
            box-shadow: 5px 0 15px rgba(0,0,0,0.1);
        }

        /* Brief/Text blendet sich sanft ein */
        .door-frame.open ~ .love-letter-container {
            opacity: 1;
            transform: scale(1);
        }

        /* Herz-Klopfen Animation */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Hinweis-Text über der Tür */
        .hint {
            position: absolute;
            top: -60px;
            width: 100%;
            text-align: center;
            color: #6f4e37;
            font-weight: bold;
            font-size: 1.1rem;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

    <div class="door-frame" id="doorFrame" onclick="openDoor()">
        <div class="hint">Öffne mich... ✨</div>
        <div class="door">
            <div class="doorknob"></div>
        </div>
    </div>

    <div class="love-letter-container">
        <h1>Für die wunderbarste Person ❤️</h1>
        <p>
            Seit du in mein Leben getreten bist, ist jeder Tag so viel schöner. 
            Ich wollte dir auf diesem Weg einfach mal sagen, wie unglaublich wichtig du mir bist 
            und wie sehr ich jede Sekunde mit dir genieße.
        </p>
        <p><strong>Ich liebe dich!</strong></p>
        <div class="heart">❤️</div>
    </div>

    <script>
        // Funktion, die beim Klick auf die Tür ausgeführt wird
        function openDoor() {
            const doorFrame = document.getElementById('doorFrame');
            doorFrame.classList.add('open');
        }
    </script>

</body>
</html>
